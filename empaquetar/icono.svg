<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- fondo redondeado con degradado y brillo -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#fondo)"/>
  <ellipse cx="44" cy="30" rx="60" ry="26" fill="#ffffff" opacity="0.10"/>

  <!-- sombra manual del documento -->
  <path d="M37 30 h40 l22 22 v58 a5 5 0 0 1 -5 5 h-57 a5 5 0 0 1 -5 -5 v-75 a5 5 0 0 1 5 -5 z" fill="#1e1b4b" opacity="0.28"/>

  <!-- documento (proforma) -->
  <path d="M34 26 h40 l22 22 v58 a5 5 0 0 1 -5 5 h-57 a5 5 0 0 1 -5 -5 v-75 a5 5 0 0 1 5 -5 z" fill="#ffffff"/>
  <path d="M74 26 v17 a5 5 0 0 0 5 5 h17 z" fill="#c7d2fe"/>

  <!-- líneas del documento -->
  <g stroke-linecap="round">
    <line x1="43" y1="60" x2="78" y2="60" stroke="#475569" stroke-width="4.5"/>
    <line x1="43" y1="72" x2="86" y2="72" stroke="#cbd5e1" stroke-width="4.5"/>
    <line x1="43" y1="84" x2="72" y2="84" stroke="#cbd5e1" stroke-width="4.5"/>
    <line x1="43" y1="96" x2="80" y2="96" stroke="#cbd5e1" stroke-width="4.5"/>
  </g>

  <!-- insignia de precio -->
  <circle cx="91" cy="93" r="16" fill="#0f766e" opacity="0.30"/>
  <circle cx="90" cy="92" r="15" fill="#10b981"/>
  <text x="90" y="99" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>

  <!-- rayo «ágil» como acento, arriba a la derecha -->
  <path d="M86 16 L68 44 h11 L64 72 l34 -36 h-13 z" fill="url(#rayo)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
